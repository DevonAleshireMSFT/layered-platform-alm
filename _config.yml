title: LP-ALM
description: >-
  Layered Power Platform ALM — A security-first decomposition framework
  for Microsoft Power Platform in enterprise and government (GCC High / FedRAMP)
  deployments.

theme: just-the-docs

url: "https://DevonAleshireMSFT.github.io"
baseurl: "/layered-platform-alm"

# ----------------------------------------------------------------
# Jekyll exclusions — these files are not part of the site
# ----------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - ".ai/"
  - "pipelines/"
  - "solutions/"
  - ".gitignore"
  - "exports/"
  - "output/"

# ----------------------------------------------------------------
# Just the Docs settings
# ----------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

# ----------------------------------------------------------------
# Footer
# ----------------------------------------------------------------
footer_content: 'LP-ALM v1.0 &mdash; May 2026 &mdash;
  <a href="https://github.com/DevonAleshireMSFT/layered-platform-alm">GitHub</a>'

# ----------------------------------------------------------------
# GitHub edit links
# ----------------------------------------------------------------
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/DevonAleshireMSFT/layered-platform-alm"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

# ----------------------------------------------------------------
# Callout colours
# ----------------------------------------------------------------
callouts:
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
